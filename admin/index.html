<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>لوحة تحكم متجر إلكتروني</title>
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script>
      (function () {
        var pending = localStorage.getItem("gh_auth_pending");
        if (pending) {
          localStorage.removeItem("gh_auth_pending");
          setTimeout(function () {
            window.postMessage(pending, window.location.origin);
          }, 500);
        }
      })();
    </script>
  </body>
</html>
