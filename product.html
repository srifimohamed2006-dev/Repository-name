<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>المنتج | M-SHOP</title>
<link rel="icon" href="assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<header class="site-header"><div id="headerMount"></div></header>

<main class="container section">
  <div class="crumbs">
    <a href="#" id="homeCrumb">الرئيسية</a> /
    <a href="#" id="catCrumb"></a> /
    <span id="prodCrumb"></span>
  </div>
  <div id="productContent"></div>
</main>

<footer class="site-footer"><div id="footerMount"></div></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
  renderHeader("headerMount");
  renderFooter("footerMount");
  document.getElementById("homeCrumb").href = buildUrl("index.html");

  const country = getCountry();
  const product = getProductById(getParam("id"));
  const content = document.getElementById("productContent");

  if (!ensureCountrySelected()) {
    content.innerHTML = "";
  } else if (!product || product.country !== country) {
    content.innerHTML = `
      <div class="empty-state">
        <div class="display">هذا المنتج غير متاح</div>
        <p>هذا المنتج غير موجود، أو غير متاح للشحن في ${countryName(country)}.</p>
        <a class="btn btn-outline" style="margin-top:16px;" href="${buildUrl("index.html")}">العودة للرئيسية</a>
      </div>
    `;
  } else {
    const cat = CATEGORIES.find((c) => c.id === product.category);
    document.title = product.name + " | M-SHOP";
    document.getElementById("catCrumb").textContent = cat?.name || "";
    document.getElementById("catCrumb").href = buildUrl("category.html", { cat: product.category });
    document.getElementById("prodCrumb").textContent = product.name;

    content.innerHTML = `
      <div class="product-view">
        <div class="product-media">
          <img src="${product.image}" alt="${product.name}" />
        </div>
        <div class="product-info">
          <span class="prod-cat-tag">${cat?.name || ""}</span>
          <h1>${product.name}</h1>
          <div class="price-row">
            <span class="amount">${product.price} ${product.currency}</span>
          </div>
          <p class="desc">${product.description}</p>
          <a class="btn btn-gold" href="${product.link}" target="_blank" rel="noopener noreferrer">
            🛒 اشترِ الآن
          </a>
          <div class="trust-row">
            <span>✓ شحن إلى ${countryName(product.country)}</span>
            <span>✓ الدفع عند الاستلام (حسب سياسة المورّد)</span>
            <span>✓ إتمام الطلب عبر صفحة المورّد الرسمية</span>
          </div>
        </div>
      </div>
    `;
  }
</script>
</body>
</html>
