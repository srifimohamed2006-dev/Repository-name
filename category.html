<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>القسم | M-SHOP</title>
<link rel="icon" href="assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<header class="site-header"><div id="headerMount"></div></header>

<main class="container section">
  <div class="crumbs"><a href="#" id="homeCrumb">الرئيسية</a> / <span id="catCrumb"></span></div>
  <div class="section-head">
    <h2 id="catTitle"></h2>
    <span class="muted" id="catCount"></span>
  </div>
  <div id="catContent"></div>
</main>

<footer class="site-footer"><div id="footerMount"></div></footer>

<script src="assets/js/data.js"></script>
<script src="assets/js/main.js"></script>
<script>
(async function () {
  await loadStoreData();
  renderHeader("headerMount");
  renderFooter("footerMount");
  document.getElementById("homeCrumb").href = buildUrl("index.html");

  const country = getCountry();
  const catId = getParam("cat");
  const cat = CATEGORIES.find((c) => c.id === catId) || CATEGORIES[0];

  document.title = cat.name + " | M-SHOP";
  document.getElementById("catTitle").textContent = cat.name;
  document.getElementById("catCrumb").textContent = cat.name;

  if (!ensureCountrySelected()) {
    document.getElementById("catContent").innerHTML = "";
  } else {
    const products = getProducts({ country, category: cat.id });
    document.getElementById("catCount").textContent =
      products.length + " منتج في " + countryName(country);

    if (!products.length) {
      document.getElementById("catContent").innerHTML = `
        <div class="empty-state">
          <div class="display">لا توجد منتجات هنا بعد</div>
          <p>لم تتم إضافة منتجات لقسم "${cat.name}" في ${countryName(country)} حتى الآن. تابعنا، فالمنتجات الجديدة تُضاف باستمرار.</p>
        </div>
      `;
    } else {
      document.getElementById("catContent").innerHTML = `
        <div class="prod-grid">
          ${products
            .map(
              (p) => `
            <div class="prod-card">
              <a class="prod-thumb" href="${buildUrl("product.html", { id: p.id })}">
                <img src="${p.image}" alt="${p.name}" loading="lazy" />
              </a>
              <div class="prod-body">
                <span class="prod-cat-tag">${cat.name}</span>
                <a class="prod-name" href="${buildUrl("product.html", { id: p.id })}">${p.name}</a>
                <div class="prod-price">${p.price} <span>${p.currency}</span></div>
                <a class="btn btn-gold" href="${buildUrl("product.html", { id: p.id })}">عرض التفاصيل</a>
              </div>
            </div>
          `
            )
            .join("")}
        </div>
      `;
    }
  }
})();
</script>
</body>
</html>
